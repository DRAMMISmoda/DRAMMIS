<!--
  DRAMMIS — template email "Confirm signup"
  Non viene deployato automaticamente: va incollato a mano in
  Supabase Dashboard → Authentication → Email Templates → Confirm signup → Message body (HTML)
  Variabile usata da Supabase: {{ .ConfirmationURL }}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFAF5;padding:40px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#FFFFFF;border:1px solid rgba(12,11,8,.12);border-radius:12px;">
        <tr>
          <td style="padding:44px 40px 8px;text-align:center;">
            <img src="https://drammis.vercel.app/assets/logo.png" width="140" alt="DRAMMIS" style="display:block;margin:0 auto 32px;height:auto;max-width:140px;">
            <h1 style="margin:0 0 16px;font-family:Helvetica,Arial,sans-serif;font-size:21px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#0C0B08;">Conferma il tuo account</h1>
            <p style="margin:0 0 32px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#57534a;">
              Grazie per esserti registrato su DRAMMIS. Conferma il tuo indirizzo email per attivare l'account e iniziare a fare acquisti.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:8px;background:#0C0B08;">
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:15px 36px;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#FAFAF5;text-decoration:none;border-radius:8px;">
                    Conferma email
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px 0;text-align:center;">
            <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#9a9585;">
              Se il bottone non funziona, copia e incolla questo link nel browser:<br>
              <a href="{{ .ConfirmationURL }}" style="color:#9a9585;word-break:break-all;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 40px 32px;">
            <hr style="border:none;border-top:1px solid rgba(12,11,8,.12);margin:0 0 20px;">
            <p style="margin:0;text-align:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.5px;color:#9a9585;">
              DRAMMIS — info.drammis@gmail.com
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
